<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创新思维装饰新店开业轮播图（带水印）</title>
    <style>
        /* 全局水印样式：斜铺满全屏，半透明效果 */
        body::before {
            content: "jzzt";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 400px;
            color: rgba(0, 0, 0, 0.15); /* 水印颜色（半透明） */
            transform: rotate(-15deg); /* 倾斜角度，可调整 */
            transform-origin: 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            z-index: 9999; /* 确保水印在最上层 */
            pointer-events: none; /* 水印不影响点击交互 */
        }

        .carousel {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }
        .carousel-container {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            min-width: 100%;
        }
        .carousel-item img {
            width: 100%;
            height: auto;
        }
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .carousel-nav button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }
        .carousel-indicators {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .carousel-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }
        .carousel-indicator.active {
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="carousel">
        <div class="carousel-container">
            <div class="carousel-item"><img src="image1.jpg" alt="创新思维装饰新店起航活动"></div>
            <div class="carousel-item"><img src="image2.jpg" alt="豪礼09-12"></div>
            <div class="carousel-item"><img src="image3.jpg" alt="豪礼01-04"></div>
            <div class="carousel-item"><img src="image4.jpg" alt="豪礼05-08"></div>
        </div>
        <div class="carousel-nav">
            <button id="prev">←</button>
            <button id="next">→</button>
        </div>
        <div class="carousel-indicators">
            <div class="carousel-indicator active" data-index="0"></div>
            <div class="carousel-indicator" data-index="1"></div>
            <div class="carousel-indicator" data-index="2"></div>
            <div class="carousel-indicator" data-index="3"></div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.carousel-container');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const indicators = document.querySelectorAll('.carousel-indicator');
        let currentIndex = 0;
        const totalItems = document.querySelectorAll('.carousel-item').length;

        function updateCarousel() {
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % totalItems;
            updateCarousel();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + totalItems) % totalItems;
            updateCarousel();
        });

        indicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                currentIndex = index;
                updateCarousel();
            });
        });

        // 自动轮播（可选）
        setInterval(() => {
            nextBtn.click();
        }, 5000);
    </script>
</body>
</html>
